name: Build Test

on:
  push:
    # 11-14 用户把仓库主分支从 mumu_tts_github 改名为 main（GitHub 网页操作），
    # 本文件原来写死旧名 ⇒ 切到 main 后编译验证会**静默不跑**（我们的规矩是
    # 编译必须盯 CI 到绿，等于失去唯一验证手段）。故同步改为主分支名。
    # 11-14 晚：旧分支已按用户令删除（远端只剩 main），故只留 main。
    branches: [ main ]
    paths:
      - 'lib-script/**'
      - 'lib-tts/**'
      - 'lib-common/**'
      - 'lib-compose/**'
      - 'lib-database/**'
      - 'app/src/**'
      - 'app/build.gradle'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Check
        run: |
          chmod +x gradlew
          ./gradlew compileAppDebugKotlin --build-cache --parallel --daemon --warning-mode all
