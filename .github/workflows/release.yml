name: Build Release

on:
  # 推送 1.26.* 格式 tag 自动打包正式版 (只打 app, 不含 dev)
  push:
    tags:
      - '1.26.*'
  # 手动触发仍可用, 可选同时构建 dev 共存版
  workflow_dispatch:
    inputs:
      build_dev:
        description: "同时构建 dev 共存版 (不勾=只打 app)"
        type: boolean
        # 10-07 用户令：默认不勾（原先默认 true，等于每次多打一个 dev 共存版）
        default: false
      is_official:
        description: "这是正式版吗？(不勾=修改包，打 Pre-release 橙标；勾=正式版，进 Latest)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        # 动态生成: build_dev=true 时为 ["app","dev"], 否则只 ["app"]
        product: ${{ fromJSON(format('["app"{0}]', github.event.inputs.build_dev == 'true' && ',"dev"' || '')) }}

      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      product: ${{ matrix.product }}
      outputs_dir: "${{ github.workspace }}/app/build/outputs"
      ver_name: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Init Signature
        run: |
          touch local.properties
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='./key.p12' >> local.properties
          # 校验 Secrets 是否已配置 (空 KEY_STORE 会让签名 task 跑 14 分钟才失败)
          if [ -z "${{ secrets.KEY_STORE }}" ]; then
            echo "::error::Secret KEY_STORE 未配置, 请到 Settings > Secrets > Actions 添加 key.p12 的 Base64 编码"
            exit 1
          fi
          if [ -z "${{ secrets.ALIAS_NAME }}" ] || [ -z "${{ secrets.ALIAS_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::签名 Secrets (ALIAS_NAME/ALIAS_PASSWORD/KEY_PASSWORD) 未完整配置"
            exit 1
          fi
          # 从Secrets读取Base64并解码为 key.p12 (用 printf 避免 echo 末尾换行污染二进制)
          printf '%s' '${{ secrets.KEY_STORE }}' | base64 --decode > $GITHUB_WORKSPACE/app/key.p12
          # 校验解码后的文件非空且是 Java KeyStore
          file $GITHUB_WORKSPACE/app/key.p12
          ls -l $GITHUB_WORKSPACE/app/key.p12
          if [ ! -s $GITHUB_WORKSPACE/app/key.p12 ]; then
            echo "::error::解码后的 key.p12 为空文件, 请检查 KEY_STORE Base64 是否正确"
            exit 1
          fi
          # 提前验证 keystore 可读 (格式/别名/密码错误立即失败, 省下十几分钟构建)
          keytool -list -keystore $GITHUB_WORKSPACE/app/key.p12 -storetype PKCS12 \
            -storepass '${{ secrets.KEY_PASSWORD }}' -alias '${{ secrets.ALIAS_NAME }}' > /dev/null \
            || { echo "::error::keystore 读取失败: 请核对 KEY_STORE / KEY_PASSWORD / ALIAS_NAME"; exit 1; }

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all

      - name: Init environment variable
        run: |
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/${{ env.product }}/release/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Save version name
        run: echo "${{ env.ver_name }}" > ver_name_${{ env.product }}.txt

      - name: Upload Mappings to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mappings_${{ env.product }}_${{ env.ver_name }}
          path: ${{ env.outputs_dir }}/mapping/*/*.txt
          # 短保留兜底: artifact 仅作 job 间中转, 发布完即删, 防止占满存储配额
          retention-days: 1

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "U-TTS_${{ env.product }}_${{ env.ver_name }}"
          path: |
            ${{env.outputs_dir}}/apk/${{ env.product }}/release/*.apk
            ver_name_${{ env.product }}.txt
          retention-days: 1

  release:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # 删除 artifact 需要
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from app build
        run: |
          VER=$(cat artifacts/U-TTS_app_*/ver_name_app.txt)
          echo "ver_name=$VER" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.ver_name }}
          tag_name: ${{ env.ver_name }}
          target_commitish: ${{ github.sha }}
          # 11-08 用户令：撤 generate_release_notes（每次都在尾部生成「Full Changelog」
          # 大链接看着碍眼）——Release 页只留 APK 文件列表，说明进 commit 历史看。
          # draft: false
          # 只有「推 1.26.* tag」或「手动触发时勾了 is_official」才算正式版（进 Latest）；
          # 其余手动触发（默认）= 修改包，打 GitHub「Pre-release」橙标，Release 页一眼可分。
          # 用户 10-07 令：「我这不是实验、是 bug 不断的修改包，别被误解成能用的版本」
          #（历史口径：正式版也是手动触发的，故不能用 event_name 单独判定，必须显式勾选）
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.is_official != 'true' }}
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11-08 用户令：撤 artifact 自动删除——Actions 运行详情页保留 APK 可下载。
      # （原步骤在发布后立即删 artifact 省存储配额；代价是 Actions 页每次都看不到包，
      # 用户实拍困惑「打包文件被删了」。配额消耗：约 20MB/次，2GB 免费额度约可存 100 次，
      # 满了去 Actions 页手动清旧 artifact 即可。）
